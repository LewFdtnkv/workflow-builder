spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/workflow}
    username: ${DB_USERNAME:workflow}
    password: ${DB_PASSWORD:workflow}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-32-byte-minimum-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  auth:
    secure-cookie: ${AUTH_COOKIE_SECURE:false}
